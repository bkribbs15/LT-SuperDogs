server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: client-side routes fall back to the app shell on refresh/deep-link.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vite fingerprints these filenames on every build — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
