name: Backend Tests

# Safety net for the SuperDog rules (backend/tests). Runs the zero-dependency
# unittest suite on every backend change so a scoring regression fails loudly
# before a Saturday.

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/tests.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  backend:
    name: Run rules suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      JWT_SECRET_KEY: ci-dummy-secret-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
