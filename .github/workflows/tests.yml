name: Tests & Build

# Safety net: the SuperDog rules suite (backend/tests) and a production build
# of the frontend, on every change, so a regression fails loudly before a
# Saturday.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Rules suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      JWT_SECRET_KEY: ci-dummy-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
